name: fleetmind

services:
  postgres:
    image: postgres:18.6-alpine

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - postgres-data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.6-alpine

    command: ["redis-server", "--appendonly", "yes"]

    ports:
      - "${REDIS_PORT}:6379"

    volumes:
      - redis-data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend

    env_file:
      - .env

    environment:
      FLEETMIND_POSTGRES_DSN: >-
        postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

      FLEETMIND_REDIS_URL: redis://redis:6379/0

    ports:
      - "${BACKEND_PORT}:8000"

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
