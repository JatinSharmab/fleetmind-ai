[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fleetmind-backend"
version = "0.1.0"
description = "Backend and Digital Twin foundation for FleetMind AI"
requires-python = ">=3.14,<3.15"

dependencies = [
    "fastapi[standard]>=0.115,<1.0",
    "pydantic-settings>=2.7,<3.0",
    "networkx>=3.7,<4.0",
    "asyncpg>=0.29,<1.0",
    "redis>=5.2,<8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0",
    "pytest-asyncio>=0.25,<2.0",
    "httpx>=0.28,<1.0",
    "ruff>=0.9,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py314"